name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: GuilhermeMAG
          template: classic
          base: header, activity, metadata
          config_timezone: America/Sao_Paulo
          config_theme: tokyonight
          config_padding: 0, 8
          
          # Output configuration
          output_action: commit
          committer_message: "chore(metrics): update github metrics infographic [skip ci]"
          filename: github-metrics.svg

          # Repositories scoping (includes private, orgs, collabs, and forks)
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes

          # Languages breakdown (deep source code scan)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%

          # Contribution habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Activity calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
