name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: GuilhermeMAG
          template: classic
          base: header, activity, metadata
          config_timezone: America/Sao_Paulo
          config_theme: tokyonight
          config_padding: 0, 8
          
          # Author matching for commit/push verification
          commits_authoring: g.casagrande@uni9.edu.br, GuilhermeMAG, 38353118+GuilhermeMAG@users.noreply.github.com
          
          # Output configuration
          output_action: commit
          committer_message: "chore(metrics): update github metrics infographic [skip ci]"
          filename: github-metrics.svg

          # Repositories scoping - strictly ignore forks
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no

          # Languages breakdown (targeted programming languages, ignoring styling markup & forks)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 45
          plugin_languages_categories: programming
          plugin_languages_ignored: css, scss, html, less
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%

          # Activity calendar (3D isometric calendar without buggy habits plugin)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
